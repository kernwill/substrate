run:
  timeout: 5m

linters:
  enable:
    - depguard
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - revive

linters-settings:
  depguard:
    rules:
      # ARCHITECTURAL INVARIANT: frontend and ir must never import backends.
      # This is the rule that keeps the compiler framework-agnostic.
      frontend-no-backends:
        files:
          - "**/internal/frontend/**"
        deny:
          - pkg: "github.com/kernwill/substrate/internal/backends"
            desc: "frontend must not import backends. Framework logic belongs only in backends."
      ir-no-backends:
        files:
          - "**/internal/ir/**"
        deny:
          - pkg: "github.com/kernwill/substrate/internal/backends"
            desc: "ir must not import backends. The IR is framework-agnostic by definition."
      ir-no-frontend:
        files:
          - "**/internal/ir/**"
        deny:
          - pkg: "github.com/kernwill/substrate/internal/frontend"
            desc: "ir must not import frontend. Frontends produce facts; ir consumes them via interfaces."
