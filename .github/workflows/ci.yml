name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false

      # Architectural invariant. Runs first and fails fast.
      - name: boundaries
        run: ./scripts/check-boundaries.sh

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race -count=1

      - name: build
        run: go build -trimpath -o bin/substrate ./cmd/substrate

      # Enable once `compile` exists (ticket T-009).
      # - name: reproducibility
      #   run: ./scripts/check-reproducible.sh
