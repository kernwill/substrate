name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: false

      # Architectural invariant. Runs first and fails fast.
      - name: boundaries
        run: ./scripts/check-boundaries.sh

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: test
        run: go test ./... -race -count=1

      - name: build
        run: go build -trimpath -o bin/substrate ./cmd/substrate

      - name: reproducibility
        run: ./scripts/check-reproducible.sh
